name: CI — verify and publish image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Pylint
        run: python -m pylint app --score=no

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          for arch in amd64 arm64; do
            docker buildx build \
              --platform "linux/${arch}" \
              --load \
              --tag "devops-ci-app:${GITHUB_SHA}-${arch}" .
          done

      - name: Smoke-test containers
        run: |
          set -euo pipefail

          cleanup() {
            docker logs smoke || true
            docker rm -f smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for arch in amd64 arm64; do
            echo "Testing linux/${arch}"

            docker run -d \
              --platform "linux/${arch}" \
              --name smoke \
              -p 127.0.0.1:5000:5000 \
              "devops-ci-app:${GITHUB_SHA}-${arch}"

            ready=0
            for attempt in {1..30}; do
              if curl --fail --silent --show-error --max-time 2 \
                http://127.0.0.1:5000/health --output health.json; then
                ready=1
                break
              fi
              sleep 2
            done

            if [ "$ready" -ne 1 ]; then
              echo "::error::Health check failed for ${arch}"
              exit 1
            fi

            python3 -m json.tool health.json
            python3 -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'

            docker exec smoke id
            test "$(docker exec smoke id -u)" -ne 0

            cleanup
          done

          trap - EXIT

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for arch in amd64 arm64; do
            docker tag \
              "devops-ci-app:${GITHUB_SHA}-${arch}" \
              "${IMAGE_NAME}:${GITHUB_SHA}-${arch}"

            docker push "${IMAGE_NAME}:${GITHUB_SHA}-${arch}"
          done

      - name: Create multi-platform manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:${GITHUB_SHA}-arm64"

      - name: Inspect published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_SHA}"
